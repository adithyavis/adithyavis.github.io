<!--
  Source for public/assets/og-image.png, the 1200×630 link-preview image
  referenced by the og:image and twitter:image tags in index.html.

  Regenerate after editing (macOS, from the repo root):

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --hide-scrollbars --force-device-scale-factor=1 \
      --user-data-dir="$(mktemp -d)" --window-size=1200,630 \
      --virtual-time-budget=5000 \
      --screenshot=public/assets/og-image.png "file://$PWD/scripts/og-image.html"
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600&family=Geist+Mono:wght@400&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0a0a0b;
    font-family: 'Instrument Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Mirrors the site's hero: the light intro card beside two stat tiles. */
  .frame {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
    height: 100%;
    padding: 44px;
  }

  .intro {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 52px;
    border-radius: 32px;
    background: #f4f4f5;
    color: #0a0a0b;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .brand svg { width: 44px; height: 44px; }

  h1 {
    font-size: 66px;
    font-weight: 500;
    line-height: 1.02;
    letter-spacing: -0.045em;
  }

  .url {
    font-family: 'Geist Mono', monospace;
    font-size: 20px;
    color: #3f3f46;
  }

  .stats {
    display: grid;
    grid-template-rows: 1fr 1fr;
    gap: 20px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 36px;
    border: 1px solid #232327;
    border-radius: 32px;
    background: #141416;
    color: #f4f4f5;
  }

  .value {
    font-size: 84px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: -0.05em;
  }

  .label {
    margin-top: 12px;
    font-size: 22px;
    line-height: 1.3;
    color: #a1a1aa;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="intro">
    <div class="brand">
      <!-- Inlined copy of public/assets/favicon.svg. -->
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="10.15" y1="-5.85" x2="53.85" y2="69.85">
            <stop offset="0" stop-color="#8b7ffa"/>
            <stop offset="0.5" stop-color="#6355e8"/>
            <stop offset="1" stop-color="#3d31b5"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="21" fill="url(#tile)"/>
        <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15.5 20L26.5 32L15.5 44" stroke-width="8.5"/>
          <path d="M35 44.25H49" stroke-width="8"/>
        </g>
      </svg>
      Adithya Viswamithiran
    </div>
    <h1>Staff engineer building mobile &amp; web products used by millions.</h1>
    <div class="url">adithyavis.github.io</div>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="value">3M+</div>
      <div class="label">monthly active users at levels.fyi</div>
    </div>
    <div class="stat">
      <div class="value">1M+</div>
      <div class="label">total npm downloads</div>
    </div>
  </div>
</div>
</body>
</html>
