  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="20.25" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
