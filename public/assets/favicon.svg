      <stop offset="0" stop-color="#8b7ffa"/>
      <stop offset="0.5" stop-color="#6355e8"/>
      <stop offset="1" stop-color="#3d31b5"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="21" fill="url(#tile)"/>
